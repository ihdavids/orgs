<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A pomodoro, as the server runs it</title>
  <desc>orgs focus starts a session: the server clocks in and counts 25 minutes, then clocks out and notes the pomodoro in the heading's logbook, runs a 5 minute break (15 minutes every fourth time), and goes idle or starts the next one. Every step is an event every client hears.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" rx="14" fill="#fbfaf7" stroke="#e2ddd1"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2f36">A pomodoro, as the server runs it</text>

  <!-- start -->
  <rect x="24" y="78" width="160" height="70" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
  <text x="104" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2f36">you pick a task</text>
  <text x="104" y="124" text-anchor="middle" font-size="11.5" fill="#4a4f57" font-family="Menlo, 'SF Mono', Consolas, monospace">orgs focus</text>
  <text x="104" y="140" text-anchor="middle" font-size="11" fill="#6b7079">or worg, or a query</text>

  <!-- work -->
  <rect x="226" y="66" width="230" height="94" rx="10" fill="#fdeceb" stroke="#e88b84" stroke-width="1.6"/>
  <text x="341" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2f36">🍅 Work · 25 min</text>
  <text x="341" y="114" text-anchor="middle" font-size="12" fill="#4a4f57">the server clocks in on the heading</text>
  <text x="341" y="132" text-anchor="middle" font-size="12" fill="#4a4f57">and counts down, even with no</text>
  <text x="341" y="148" text-anchor="middle" font-size="12" fill="#4a4f57">client open</text>

  <!-- time up -->
  <rect x="498" y="66" width="250" height="94" rx="10" fill="#fff4e0" stroke="#f5a623" stroke-width="1.6"/>
  <text x="623" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2f36">Time is up</text>
  <text x="623" y="114" text-anchor="middle" font-size="12" fill="#4a4f57">clock out: the CLOCK line is written,</text>
  <text x="623" y="132" text-anchor="middle" font-size="12" fill="#4a4f57">and beside it in the logbook</text>
  <text x="623" y="150" text-anchor="middle" font-size="10.5" fill="#8a6a2c" font-family="Menlo, 'SF Mono', Consolas, monospace">- Pomodoro: 25 min focus, 5 min break</text>

  <!-- short break -->
  <rect x="790" y="66" width="146" height="94" rx="10" fill="#eaf6ea" stroke="#8cc58c" stroke-width="1.6"/>
  <text x="863" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2f36">☕ Break</text>
  <text x="863" y="118" text-anchor="middle" font-size="12" fill="#4a4f57">5 min</text>
  <text x="863" y="138" text-anchor="middle" font-size="11" fill="#6b7079">15 every 4th</text>

  <g stroke="#8a8f98" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M186,113 L222,113"/>
    <path d="M458,113 L494,113"/>
    <path d="M750,113 L786,113"/>
    <!-- break over: next pomodoro -->
    <path d="M863,162 C863,230 341,230 341,164"/>
  </g>
  <text x="602" y="222" text-anchor="middle" font-size="11.5" fill="#6b7079" font-style="italic">break over: the next one starts (AutoNext), or the session goes idle</text>

  <!-- escape hatches -->
  <g font-size="11.5" fill="#4a4f57">
    <text x="36" y="262" font-weight="700" fill="#2b2f36">Keys while it runs</text>
    <text x="36" y="282"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace">q</tspan> stop: clock out, no logbook note, not counted</text>
    <text x="36" y="300"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace">+</tspan> five more minutes · <tspan font-family="Menlo, 'SF Mono', Consolas, monospace">n</tspan> skip: finish early (counts), or end a break</text>
    <text x="36" y="318"><tspan font-family="Menlo, 'SF Mono', Consolas, monospace">d</tspan> leave: the timer keeps running on the server</text>
    <text x="36" y="336">Clock out or clock in elsewhere, from anywhere, and the work phase ends</text>
  </g>

  <!-- who shows it -->
  <text x="24" y="384" font-size="13" font-weight="700" fill="#6b7079">Every step is an event, so every client shows the same session</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="24" y="398" width="172" height="74" rx="8" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="110" y="420" font-weight="700" fill="#2b2f36">orgs dash</text>
    <text x="110" y="440" fill="#4a4f57">the Now card: countdown</text>
    <text x="110" y="456" fill="#4a4f57">and progress bar</text>

    <rect x="208" y="398" width="172" height="74" rx="8" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="294" y="420" font-weight="700" fill="#2b2f36">tmux, a prompt</text>
    <text x="294" y="440" fill="#4a4f57" font-family="Menlo, 'SF Mono', Consolas, monospace">orgs focus status</text>
    <text x="294" y="456" fill="#4a4f57">🍅 12:31 Write the report</text>

    <rect x="392" y="398" width="172" height="74" rx="8" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="478" y="420" font-weight="700" fill="#2b2f36">macOS menu bar</text>
    <text x="478" y="440" fill="#4a4f57" font-family="Menlo, 'SF Mono', Consolas, monospace">orgs focus bar</text>
    <text x="478" y="456" fill="#4a4f57">xbar or SwiftBar</text>

    <rect x="576" y="398" width="172" height="74" rx="8" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="662" y="420" font-weight="700" fill="#2b2f36">worg</text>
    <text x="662" y="440" fill="#4a4f57">the header chip and</text>
    <text x="662" y="456" fill="#4a4f57">the Focus tab</text>

    <rect x="760" y="398" width="176" height="74" rx="8" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="848" y="420" font-weight="700" fill="#2b2f36">VS Code, Sublime</text>
    <text x="848" y="440" fill="#4a4f57">the running clock in</text>
    <text x="848" y="456" fill="#4a4f57">the status bar</text>
  </g>
</svg>
