<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A writing day</title>
  <desc>Morning: the walk habit and the day's agenda. The session: writing mode with a session target, pomodoros from orgs focus. As he types, worg posts the file's word count to the writing log, which the goals dialog, orgs write, the status bar and orgs recap all read.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#fbfaf7" stroke="#e2ddd1"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2f36">A writing day</text>

  <!-- the day, left to right -->
  <g font-size="12" fill="#6b7079" text-anchor="middle">
    <rect x="24" y="64" width="190" height="96" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="119" y="88" font-size="14" font-weight="700" fill="#2b2f36">8:00 · Before</text>
    <text x="119" y="110">tick the walk habit</text>
    <text x="119" y="128">orgs dash: due, waiting, inbox</text>
    <text x="119" y="146">pick today's scene</text>

    <rect x="238" y="64" width="250" height="96" rx="10" fill="#fff4e0" stroke="#f5a623" stroke-width="1.6"/>
    <text x="363" y="88" font-size="14" font-weight="700" fill="#2b2f36">9:00 · The session</text>
    <text x="363" y="110">writing mode, session target 500</text>
    <text x="363" y="128">orgs focus: 50 minutes, 10 off</text>
    <text x="363" y="146">ideas and notes into the inbox, not now</text>

    <rect x="512" y="64" width="200" height="96" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="612" y="88" font-size="14" font-weight="700" fill="#2b2f36">11:30 · Stop</text>
    <text x="612" y="110">mid-sentence, on purpose</text>
    <text x="612" y="128">a # NOTE: for tomorrow</text>
    <text x="612" y="146">tick "Write 500 words"</text>

    <rect x="736" y="64" width="200" height="96" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="836" y="88" font-size="14" font-weight="700" fill="#2b2f36">Afternoon</text>
    <text x="836" y="110">the business: triage, mail</text>
    <text x="836" y="128">research tasks</text>
    <text x="836" y="146">Friday: review and recap</text>
  </g>
  <g stroke="#8a8f98" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M215,112 L236,112"/>
    <path d="M489,112 L510,112"/>
    <path d="M713,112 L734,112"/>
  </g>

  <!-- the log -->
  <path d="M363,162 L363,236" stroke="#8a8f98" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="372" y="204" font-size="11" fill="#8a8f98" font-style="italic">the file's word count, every half minute while typing</text>
  <rect x="263" y="238" width="200" height="62" rx="10" fill="#ffffff" stroke="#c9c3b5" stroke-dasharray="5 4"/>
  <text x="363" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2f36">the writing log</text>
  <text x="363" y="284" text-anchor="middle" font-size="11.5" fill="#6b7079">on the server: day, file, start, end</text>

  <!-- readers -->
  <g font-size="12" fill="#6b7079" text-anchor="middle">
    <rect x="24" y="346" width="210" height="66" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="129" y="370" font-size="13" font-weight="700" fill="#2b2f36">Goals and rhythm</text>
    <text x="129" y="390">today, week, month, heatmap</text>

    <rect x="254" y="346" width="210" height="66" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="359" y="370" font-size="13" font-weight="700" fill="#2b2f36">orgs write</text>
    <text x="359" y="390">the same numbers at a prompt</text>

    <rect x="484" y="346" width="210" height="66" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="589" y="370" font-size="13" font-weight="700" fill="#2b2f36">orgs write -short</text>
    <text x="589" y="390">✍ 437/500 · 19d in a status bar</text>

    <rect x="714" y="346" width="222" height="66" rx="10" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="825" y="370" font-size="13" font-weight="700" fill="#2b2f36">orgs recap</text>
    <text x="825" y="390">the week's words beside the rest</text>
  </g>
  <g stroke="#8a8f98" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M300,302 C300,326 129,322 129,344"/>
    <path d="M350,302 L357,344"/>
    <path d="M400,302 C420,326 589,322 589,344"/>
    <path d="M440,302 C470,322 825,316 825,344"/>
  </g>
</svg>
