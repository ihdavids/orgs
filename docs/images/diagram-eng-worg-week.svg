<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Marco's week in worg</title>
  <desc>Monday: Weekly Review, Insights estimates, the Agenda's day planner. Tuesday: Focus and capture. Wednesday: Refactor, Insights dependencies, Gantt Chart. Thursday: Kanban and notifications. Friday: Clock Report, Habits and the Inbox. Every day: plan the day, work in pomodoros, capture with c, empty the inbox.</desc>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#fbfaf7" stroke="#e2ddd1"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2f36">Marco's week in worg</text>

  <g font-size="12" fill="#2b2f36" text-anchor="middle">
    <!-- day headers -->
    <g font-size="14" font-weight="700">
      <text x="106" y="72">Monday</text>
      <text x="291" y="72">Tuesday</text>
      <text x="476" y="72">Wednesday</text>
      <text x="661" y="72">Thursday</text>
      <text x="846" y="72">Friday</text>
    </g>
    <g font-size="11.5" fill="#6b7079" font-style="italic">
      <text x="106" y="90">review and plan</text>
      <text x="291" y="90">heads down</text>
      <text x="476" y="90">clean up the plan</text>
      <text x="661" y="90">unblock</text>
      <text x="846" y="90">close the week</text>
    </g>

    <!-- Monday -->
    <rect x="20" y="104" width="172" height="52" rx="9" fill="#fff4e0" stroke="#f5a623"/>
    <text x="106" y="126" font-weight="700">Weekly Review</text>
    <text x="106" y="144" fill="#6b7079">seven steps, one key each</text>
    <rect x="20" y="166" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="106" y="188" font-weight="700">Insights · Estimates</text>
    <text x="106" y="206" fill="#6b7079">how far off is he?</text>
    <rect x="20" y="228" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="106" y="250" font-weight="700">Agenda · day planner</text>
    <text x="106" y="268" fill="#6b7079">tasks onto hours</text>

    <!-- Tuesday -->
    <rect x="205" y="104" width="172" height="52" rx="9" fill="#fff4e0" stroke="#f5a623"/>
    <text x="291" y="126" font-weight="700">Focus</text>
    <text x="291" y="144" fill="#6b7079">25 / 5, four in a set</text>
    <rect x="205" y="166" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="291" y="188" font-weight="700">Capture (c)</text>
    <text x="291" y="206" fill="#6b7079">interruptions, not lost</text>
    <rect x="205" y="228" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="291" y="250" font-weight="700">The focus chip</text>
    <text x="291" y="268" fill="#6b7079">the timer on every tab</text>

    <!-- Wednesday -->
    <rect x="390" y="104" width="172" height="52" rx="9" fill="#fff4e0" stroke="#f5a623"/>
    <text x="476" y="126" font-weight="700">Refactor</text>
    <text x="476" y="144" fill="#6b7079">a list into tasks</text>
    <rect x="390" y="166" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="476" y="188" font-weight="700">Insights · Dependencies</text>
    <text x="476" y="206" fill="#6b7079">what waits on what</text>
    <rect x="390" y="228" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="476" y="250" font-weight="700">Gantt Chart</text>
    <text x="476" y="268" fill="#6b7079">the relaunch in time</text>

    <!-- Thursday -->
    <rect x="575" y="104" width="172" height="52" rx="9" fill="#fff4e0" stroke="#f5a623"/>
    <text x="661" y="126" font-weight="700">Notifications</text>
    <text x="661" y="144" fill="#6b7079">a watch on Blocked</text>
    <rect x="575" y="166" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="661" y="188" font-weight="700">Kanban</text>
    <text x="661" y="206" fill="#6b7079">move it, change it</text>

    <!-- Friday -->
    <rect x="760" y="104" width="172" height="52" rx="9" fill="#fff4e0" stroke="#f5a623"/>
    <text x="846" y="126" font-weight="700">Inbox</text>
    <text x="846" y="144" fill="#6b7079">to zero, one key each</text>
    <rect x="760" y="166" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="846" y="188" font-weight="700">Clock Report</text>
    <text x="846" y="206" fill="#6b7079">where the week went</text>
    <rect x="760" y="228" width="172" height="52" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="846" y="250" font-weight="700">Habits</text>
    <text x="846" y="268" fill="#6b7079">the streaks held?</text>
  </g>

  <!-- every day band -->
  <rect x="20" y="314" width="912" height="128" rx="12" fill="#ffffff" stroke="#c9c3b5" stroke-dasharray="5 4"/>
  <text x="476" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2f36">Every day</text>
  <g font-size="12.5" fill="#2b2f36" text-anchor="middle">
    <rect x="44" y="356" width="196" height="64" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="142" y="382" font-weight="700">8:45 · the Agenda</text>
    <text x="142" y="402" fill="#6b7079">habits, the day, what to place</text>
    <rect x="262" y="356" width="196" height="64" rx="9" fill="#fff4e0" stroke="#f5a623"/>
    <text x="360" y="382" font-weight="700">pomodoros · Focus</text>
    <text x="360" y="402" fill="#6b7079">on a NEXT action, clocked</text>
    <rect x="480" y="356" width="196" height="64" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="578" y="382" font-weight="700">c · capture</text>
    <text x="578" y="402" fill="#6b7079">whatever comes up</text>
    <rect x="698" y="356" width="210" height="64" rx="9" fill="#eef4fb" stroke="#9cbbe0"/>
    <text x="803" y="382" font-weight="700">17:00 · the Inbox</text>
    <text x="803" y="402" fill="#6b7079">decide every new thing</text>
  </g>
  <g stroke="#8a8f98" stroke-width="1.6" fill="none">
    <path d="M240,388 L258,388" marker-end="url(#a)"/>
    <path d="M458,388 L476,388" marker-end="url(#a)"/>
    <path d="M676,388 L694,388" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <text x="480" y="460" text-anchor="middle" font-size="11.5" fill="#8a6a2c" font-style="italic">orange: the tab the day is built around · blue: the tabs that go with it</text>
</svg>
