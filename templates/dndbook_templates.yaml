tables:
  # A table nobody named. In this class that is a DndTable rather than a
  # tabular: the column spec the exporter builds for a dndbook is made of
  # tabularx's X columns, which mean nothing to a plain tabular - and a book
  # whose tables are not the book's tables is the whole class missed.
  #
  # Special rows - the |---+---| rule under a header - are dropped rather than
  # turned into \hline, because DndTable draws its own header and stripes the
  # rows itself.
  default:
    vertical: false
    template: |+
      \begin{DndTable}{% if havecaption %}[header={ {{caption}} }]{% endif %}{ {{separators}} }
      {% for row in rows %}{% if row.Isspecial %}{% else %}{{ row.Cols | sepList: "&" | safe}} \\{% endif %}
      {% endfor %}\end{DndTable}
  Stats:
    template: |+
      \DndMonsterBasics[
        armor-class = { {{ac}} },
        hit-points  = { {{hitpoints}} },
        speed       = { {{speed}} },
        ]
  AbilityScores:
    template: |+
      \DndMonsterAbilityScores[
        str = { {{str}} },
        dex = { {{dex}} },
        con = { {{con}} },
        int = { {{int}} },
        wis = { {{wis}} },
        cha = { {{cha}} },
        ]
  MonsterDetails:
    vertical: true
    template: |+
        \DndMonsterDetails[
          {% if savingthrows %}saving-throws = { {{savingthrows}} },{% endif %}
          {% if skills %}skills = { {{skills}} },{% endif %}
          {% if damagevulnerabilities %}damage-vulnerabilities = { {{damagevulnerabilities}} },{% endif %}
          {% if damageresistances %}damage-resistances = { {{damageresistances}} },{% endif %}
          {% if damageimmunities %}damage-immunities = { {{damageimmunities}} },{% endif %}
          {% if conditionimmunities %}condition-immunities = { {{conditionimmunities}} },{% endif %}
          {% if senses %}senses = { {{senses}} },{% endif %}
          {% if languages %}languages = { {{languages}} },{% endif %}
          {% if challenge %}challenge = {{challenge}},{% endif %}
          ]
  MonsterAttack:
    vertical: true
    template: |+
      \DndMonsterAttack[
          {% if name %}name = { {{name}} },
          {% endif %}{% if distance %}distance = { {{distance}} },
          {% endif %}{% if type %}type = { {{type}} },
          {% endif %}{% if mod %}mod = { {{mod}} },
          {% endif %}{% if reach %}reach = { {{reach}} },
          {% endif %}{% if range %}range = { {{range}} },
          {% endif %}{% if targets %}targets = { {{targets}} },
          {% endif %}{% if dmg %}dmg = { {{dmg}} },
          {% endif %}{% if dmgtype %}dmg-type = { {{dmgtype}} },
          {% endif %}{% if plusdmg %}plus-dmg = { {{plusdmg}} },
          {% endif %}{% if plusdmgtype %}plus-dmg-type = { {{plusdmgtype}} },
          {% endif %}{% if ordmg %}or-dmg = { {{ordmg}} },
          {% endif %}{% if ordmgwhen %}or-dmg-when = { {{ordmgwhen}} },
          {% endif %}{% if extra %}extra = { {{extra}} },
          {% endif %}]
  MonsterMelee:
    vertical: true
    template: |+
      \DndMonsterMelee[
          {% if name %}name = { {{name}} },
          {% endif %}{% if distance %}distance = { {{distance}} },
          {% endif %}{% if type %}type = { {{type}} },
          {% endif %}{% if mod %}mod = { {{mod}} },
          {% endif %}{% if reach %}reach = { {{reach}} },
          {% endif %}{% if range %}range = { {{range}} },
          {% endif %}{% if targets %}targets = { {{targets}} },
          {% endif %}{% if dmg %}dmg = { {{dmg}} },
          {% endif %}{% if dmgtype %}dmg-type = { {{dmgtype}} },
          {% endif %}{% if plusdmg %}plus-dmg = { {{plusdmg}} },
          {% endif %}{% if plusdmgtype %}plus-dmg-type = { {{plusdmgtype}} },
          {% endif %}{% if ordmg %}or-dmg = { {{ordmg}} },
          {% endif %}{% if ordmgwhen %}or-dmg-when = { {{ordmgwhen}} },
          {% endif %}{% if extra %}extra = { {{extra}} },
          {% endif %}]
  MonsterRanged:
    vertical: true
    template: |+
      \DndMonsterRanged[
          {% if name %}name = { {{name}} },
          {% endif %}{% if distance %}distance = { {{distance}} },
          {% endif %}{% if type %}type = { {{type}} },
          {% endif %}{% if mod %}mod = { {{mod}} },
          {% endif %}{% if reach %}reach = { {{reach}} },
          {% endif %}{% if range %}range = { {{range}} },
          {% endif %}{% if targets %}targets = { {{targets}} },
          {% endif %}{% if dmg %}dmg = { {{dmg}} },
          {% endif %}{% if dmgtype %}dmg-type = { {{dmgtype}} },
          {% endif %}{% if plusdmg %}plus-dmg = { {{plusdmg}} },
          {% endif %}{% if plusdmgtype %}plus-dmg-type = { {{plusdmgtype}} },
          {% endif %}{% if ordmg %}or-dmg = { {{ordmg}} },
          {% endif %}{% if ordmgwhen %}or-dmg-when = { {{ordmgwhen}} },
          {% endif %}{% if extra %}extra = { {{extra}} },
          {% endif %}]
  InnateMonsterSpells:
    vertical: false
    template: |+
      \begin{DndMonsterSpells}
      {% for spell in ctbl %}  \DndInnateSpellLevel{{spell.Key}}{ {{spell.Val|commaList}} }
      {% endfor %}
      \end{DndMonsterSpells}
  MonsterSpells:
    vertical: false
    template: |+
      \begin{DndMonsterSpells}
      {% for spell in ctbl %}  \DndMonsterSpellLevel{{spell.Key}}{ {{spell.Val|commaList}} } 
      {% endfor %}
      \end{DndMonsterSpells}
  LegendaryActions:
    template: |+
      \begin{DndMonsterLegendaryActions}
      {% for act in tbl %}  \DndMonsterLegendaryAction{ {{act.name}} }{ {{act.description}} }
      {% endfor %}
      \end{DndMonsterLegendaryActions}
# A paragraph in this class is a paragraph, with nothing in front of it.
#
# The generic class writes \par before each one, and the writer has always had
# a `docclass != "dndbook"` guard saying this class should not get it - a guard
# that never fired, because the template always won over the branch holding it.
# It matters beyond taste: a \par is fatal inside the argument of a macro that
# is not \long, which is what \DndMonsterType is. The blank line the template
# ends on separates one paragraph from the next, which is all \par was for.
paragraph:
  default:
    template: |+
      {{content | safe}}

headings:
  ITEM:
    template: |+
      \DndItemHeader{ {{heading}} }
        { {{RARITY}} }
        {{content}}
  SPELL:
    template: |+
      \DndSpellHeader%
        { {{heading}} }
        { {{LEVELSCHOOL}} }
        { {{CASTTIME}} }
        { {{RANGE}} }
        { {{COMPONENTS}} }
        { {{DURATION}} }
        {{content}}
  FEAT:
    template: |+
      \DndFeatHeader{ {{heading}} }[ {{INFO}} ]
      {{content}}
  MONSTER:
    template: |+
      \begin{DndMonster}[float*=b,width=\textwidth + 8pt]{ {{heading}} }\begin{multicols}{2}
      {{content}}
      \end{multicols}
      \end{DndMonster}
  INNATESPELLCASTING:
    template: |+
      \DndMonsterAction{Innate Spellcasting}
        {{content}}
  SPELLCASTING:
    template: |+
      \DndMonsterAction{Spellcasting}
        {{content}}
  MONSTERSECTION:
    template: |+
      \DndMonsterSection{ {{heading}} }
        {{content}}
  MONSTERACTION:
    template: |+
      \DndMonsterAction{ {{heading}} }
        {{content}}
  PART:
    template: |+
      \part{ {{heading}} }
        {{content}}
  CHAPTER:
    template: |+
      \chapter{ {{heading}} }
        {{content}}