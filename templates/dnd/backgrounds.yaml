# ---------------------------------------------------------------------------
# Extra backgrounds - an example of an add on module.
#
# The SRD only publishes one background (Acolyte). This module declares
# "id: srd", so everything in it is merged into the srd ruleset the moment the
# file is found on one of your dndPaths. Copy this file, change the entries and
# you have your own campaign's backgrounds.
#
# The rules text here is written for orgs, it is not SRD material.
# ---------------------------------------------------------------------------
id: srd

backgrounds:
  - id: charlatan
    name: Charlatan
    source: orgs
    summary: "Deception, Sleight of Hand - a second face for every town."
    text: "You have always had a way with people. You know what makes them tick, you can tease out their hearts' desires after a few minutes of conversation, and with a few leading questions you can read them like they were children's books."
    proficiencies:
      skills: [deception, sleight-of-hand]
      tools: ["disguise kit", "forgery kit"]
    gold: 15
    equipment:
      - {id: clothes-fine, qty: 1}
      - {id: disguise-kit, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: False Identity
      text: "You have a second identity complete with documentation, established acquaintances and disguises. You can forge documents including official papers and personal letters, provided you have seen an example of the kind of document or handwriting you are trying to copy."
    traits:
      - "I fall in and out of love easily, and am always pursuing someone."
      - "I have a joke for every occasion, especially occasions where humour is inappropriate."
      - "Flattery is my preferred trick for getting what I want."
      - "I pocket anything I see that might have some value."
    ideals:
      - "Independence. I am a free spirit, nobody tells me what to do."
      - "Fairness. I never target people who cannot afford to lose a few coins."
      - "Charity. I give away most of what I take to those who really need it."
      - "Creativity. I never run the same con twice."
    bonds:
      - "I fleeced the wrong person and must make sure they never find me."
      - "I owe everything to my mentor, a horrible person who is probably in a cell somewhere."
      - "Somewhere out there I have a child who does not know me."
      - "A powerful person killed someone I loved. Some day soon I will have my revenge."
    flaws:
      - "I cannot resist a pretty face."
      - "I am always in debt, I spend what I steal on decadent luxuries."
      - "I am convinced nobody could ever fool me the way I fool others."
      - "I am too greedy for my own good."

  - id: criminal
    name: Criminal
    source: orgs
    summary: "Deception, Stealth - a contact who still owes you a favour."
    text: "You are an experienced criminal with a history of breaking the law. You have spent a lot of time among other criminals and still have contacts within that world."
    proficiencies:
      skills: [deception, stealth]
      tools: ["thieves' tools", "one gaming set"]
    gold: 15
    equipment:
      - {id: crowbar, qty: 1}
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Criminal Contact
      text: "You have a reliable and trustworthy contact who acts as your liaison to a network of other criminals. You know how to get messages to and from that contact over great distances, using local messengers, corrupt caravan masters and seedy sailors."
    traits:
      - "I always have a plan for what to do when things go wrong."
      - "I am always calm, no matter the situation, and I never raise my voice."
      - "The first thing I do in a new place is note the locations of everything valuable."
      - "I would rather make a new friend than a new enemy."
    ideals:
      - "Honour. I do not steal from others in the trade."
      - "Freedom. Chains are meant to be broken, as are those who forge them."
      - "Charity. I steal from the wealthy so that I can help the people I grew up with."
      - "Greed. I will do whatever it takes to become rich."
    bonds:
      - "I am trying to pay off an old debt to a generous benefactor."
      - "Someone I loved died because of a mistake I made. That will never happen again."
      - "I will become the greatest thief who ever lived."
      - "Everything I steal goes to support my family."
    flaws:
      - "When I see something valuable I cannot think about anything but how to steal it."
      - "Faced with a choice between money and my friends, I usually choose the money."
      - "If there is a plan I will forget it, and if I do not forget it I will ignore it."
      - "I turn tail and run when things look bad."

  - id: entertainer
    name: Entertainer
    source: orgs
    summary: "Acrobatics, Performance - an audience in every tavern."
    text: "You thrive in front of an audience. You know how to entrance them, entertain them and even inspire them. Your poetics can stir the hearts of those who hear you, awakening grief or joy, laughter or anger."
    proficiencies:
      skills: [acrobatics, performance]
      tools: ["disguise kit", "one musical instrument"]
    gold: 15
    equipment:
      - {id: musical-instrument, qty: 1}
      - {id: clothes-costume, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: By Popular Demand
      text: "You can always find a place to perform, usually in an inn or tavern but possibly with a circus, at a theatre or even in a noble's court. In return you receive free lodging and food of a modest standard, and the locals treat you well for as long as you are performing."
    traits:
      - "I know a story relevant to almost every situation."
      - "Whenever I arrive somewhere new I collect local rumours and spread gossip."
      - "I love a good insult, even one directed at me."
      - "I get bitter if I am not the centre of attention."
    ideals:
      - "Beauty. When I perform, I make the world better than it was."
      - "Tradition. The stories and legends of the past must never be forgotten."
      - "Creativity. The world needs new ideas and bold action."
      - "People. I like seeing the smiles on faces when I perform, that is all."
    bonds:
      - "My instrument is my most treasured possession, it reminds me of someone I love."
      - "Someone stole my precious instrument and one day I will get it back."
      - "I want to be famous, whatever it takes."
      - "I idolise a hero of the old tales and measure my deeds against theirs."
    flaws:
      - "I will do anything to win fame and renown."
      - "I am a sucker for a sad story."
      - "A scandal prevents me from ever going home again."
      - "I once satirised a noble who still wants my head."

  - id: folk-hero
    name: Folk Hero
    source: orgs
    summary: "Animal Handling, Survival - the common folk are on your side."
    text: "You come from a humble social rank, but you are destined for so much more. Already the people of your home village regard you as their champion, and your destiny calls you to stand against tyrants and monsters."
    proficiencies:
      skills: [animal-handling, survival]
      tools: ["one type of artisan's tools", "vehicles (land)"]
    gold: 10
    equipment:
      - {id: artisans-tools, qty: 1}
      - {id: shovel, qty: 1}
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Rustic Hospitality
      text: "Since you come from the ranks of the common folk you fit in among them easily. Ordinary people will find a place for you to hide, rest or recuperate, and will shield you from anyone searching for you, though they will not risk their lives for you."
    traits:
      - "I judge people by their actions, not their words."
      - "If someone is in trouble I am always ready to help."
      - "I have a strong sense of fair play and always look for the equitable solution."
      - "I am confident in my own abilities and try to instil that confidence in others."
    ideals:
      - "Respect. People deserve to be treated with dignity."
      - "Fairness. No one should get preferential treatment before the law."
      - "Freedom. Tyrants must not be allowed to oppress the people."
      - "Destiny. Nothing and no one can steer me away from my higher calling."
    bonds:
      - "I have a family somewhere, but I have no idea where they are."
      - "I worked the land, I love the land, and I will protect the land."
      - "A proud noble once gave me a horrible beating, and I will take my revenge."
      - "My tools are symbols of my past life, I carry them so I never forget my roots."
    flaws:
      - "The tyrant who rules my land will stop at nothing to see me killed."
      - "I am convinced of the significance of my destiny and blind to my shortcomings."
      - "The people who knew me when I was young know my shameful secret."
      - "I have a weakness for the vices of the city, especially hard drink."

  - id: guild-artisan
    name: Guild Artisan
    source: orgs
    summary: "Insight, Persuasion - a guild that vouches for you."
    text: "You are a member of an artisan's guild, skilled in a particular field and closely associated with other artisans. You are a well established part of the mercantile world, freed by talent and wealth from the constraints of a feudal social order."
    proficiencies:
      skills: [insight, persuasion]
      tools: ["one type of artisan's tools"]
    languages: 1
    gold: 15
    equipment:
      - {id: artisans-tools, qty: 1}
      - {id: clothes-travelers, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Guild Membership
      text: "Fellow guild members will provide you with lodging and food if necessary, and pay for your funeral if needed. In some cities the guild hall is a haven and a source of contacts and work. Membership costs 5 gp per month."
    traits:
      - "I believe that anything worth doing is worth doing right, I am a perfectionist."
      - "I am a snob who looks down on those who cannot appreciate fine art."
      - "I always want to know how things work and what makes people tick."
      - "I am well known for my work and I want everyone to appreciate it."
    ideals:
      - "Community. Civilised people strengthen the bonds of community."
      - "Generosity. My talents were given to me so I could use them for the world."
      - "Freedom. Everyone should be free to pursue their own livelihood."
      - "Aspiration. I work hard to be the best there is at my craft."
    bonds:
      - "The workshop where I learned my trade is the most important place in the world to me."
      - "I made a great work for someone, and then found them unworthy to receive it."
      - "I owe my guild a great debt for forging me into the person I am."
      - "I pursue wealth to secure someone's love."
    flaws:
      - "I will do anything to get my hands on something rare or priceless."
      - "I am quick to assume that someone is trying to cheat me."
      - "No one must ever learn that I once stole from the guild coffers."
      - "I am horribly, horribly awkward in social situations."

  - id: hermit
    name: Hermit
    source: orgs
    summary: "Medicine, Religion - years alone, and one great discovery."
    text: "You lived in seclusion for a formative part of your life, either in a sheltered community or entirely alone. In your time apart from the clamour of society you found quiet, solitude and perhaps some of the answers you were looking for."
    proficiencies:
      skills: [medicine, religion]
      tools: ["herbalism kit"]
    languages: 1
    gold: 5
    equipment:
      - {id: herbalism-kit, qty: 1}
      - {id: blanket, qty: 1}
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Discovery
      text: "The quiet seclusion of your hermitage gave you access to a unique and powerful discovery: a great truth about the cosmos, the location of something long lost, or a secret about the powerful. Work out the details with your GM."
    traits:
      - "I have been isolated so long that I rarely speak, preferring gestures and grunts."
      - "I am utterly serene, even in the face of disaster."
      - "I connect everything that happens to me to a grand cosmic plan."
      - "I feel tremendous empathy for all who suffer."
    ideals:
      - "Greater Good. My gifts are meant to be shared, not hoarded."
      - "Logic. Emotions must not cloud our sense of what is right and true."
      - "Free Thinking. Inquiry and curiosity are the pillars of progress."
      - "Self Knowledge. If you know yourself, there is nothing left to know."
    bonds:
      - "Nothing is more important than the other members of my hermitage."
      - "I entered seclusion because I loved someone I could not have."
      - "Should my discovery come to light it could bring ruin to the world."
      - "My isolation gave me insight into a great evil that only I can destroy."
    flaws:
      - "Now that I have returned to the world I enjoy its delights a little too much."
      - "I harbour dark thoughts that my isolation failed to quell."
      - "I am dogmatic in my thinking."
      - "I let my need to win arguments overshadow friendship and harmony."

  - id: noble
    name: Noble
    source: orgs
    summary: "History, Persuasion - a name that opens doors."
    text: "You understand wealth, power and privilege. You carry a noble title, and your family owns land, collects taxes and wields significant political influence."
    proficiencies:
      skills: [history, persuasion]
      tools: ["one gaming set"]
    languages: 1
    gold: 25
    equipment:
      - {id: clothes-fine, qty: 1}
      - {id: signet-ring, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Position of Privilege
      text: "Thanks to your noble birth people are inclined to think the best of you. You are welcome in high society, and common folk make every effort to accommodate you. You can secure an audience with a local noble if you need to."
    traits:
      - "My flattery makes everyone I talk to feel like the most important person in the world."
      - "The common folk love me for my kindness and generosity."
      - "I take great pains to always look my best and follow the latest fashions."
      - "I do not like to get my hands dirty and I will not sleep in unsuitable accommodation."
    ideals:
      - "Respect. Respect is due to me because of my position, but all people deserve dignity."
      - "Responsibility. It is my duty to respect the authority above me and care for those below."
      - "Independence. I must prove I can handle myself without my family's coddling."
      - "Power. If I can attain more power, no one will tell me what to do."
    bonds:
      - "I will face any challenge to win the approval of my family."
      - "My house's alliance with another noble family must be sustained at all costs."
      - "Nothing is more important than the other members of my family."
      - "I am in love with the heir of a family my family despises."
    flaws:
      - "I secretly believe that everyone is beneath me."
      - "I hide a scandalous secret that could ruin my family forever."
      - "I too often hear veiled insults and threats in every word addressed to me."
      - "By my words and actions I often bring shame to my family."

  - id: outlander
    name: Outlander
    source: orgs
    summary: "Athletics, Survival - the wilderness is your country."
    text: "You grew up in the wilds, far from civilisation and the comforts of town and technology. You have witnessed the migration of herds larger than forests and survived weather more extreme than any city dweller could comprehend."
    proficiencies:
      skills: [athletics, survival]
      tools: ["one musical instrument"]
    languages: 1
    gold: 10
    equipment:
      - {id: quarterstaff, qty: 1}
      - {id: hunting-trap, qty: 1}
      - {id: clothes-travelers, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Wanderer
      text: "You have an excellent memory for maps and geography, and can always recall the general layout of terrain, settlements and other features around you. You can find food and fresh water for yourself and up to five other people each day, provided the land offers them."
    traits:
      - "I am driven by a wanderlust that led me away from home."
      - "I watch over my friends as if they were a litter of newborn pups."
      - "I have a lesson for every situation, drawn from observing nature."
      - "I do not part with my money easily and will haggle tirelessly."
    ideals:
      - "Change. Life is like the seasons, in constant change, and we must change with it."
      - "Greater Good. It is each person's duty to bring happiness to the whole tribe."
      - "Honour. If I dishonour myself, I dishonour my whole clan."
      - "Nature. The natural world is more important than all the constructs of civilisation."
    bonds:
      - "My family or clan is the most important thing in my life."
      - "An injury to the unspoiled wilderness of my home is an injury to me."
      - "I will bring terrible wrath down on the people who destroyed my homeland."
      - "I suffer awful visions of a coming disaster and will do anything to prevent it."
    flaws:
      - "I am too enamoured of ale, wine and other intoxicants."
      - "There is no room for caution in a life lived to the fullest."
      - "I remember every insult and nurse a silent resentment."
      - "I am slow to trust members of other tribes and societies."

  - id: phantasmic-circus-trouper
    name: Phantasmic Circus Trouper
    source: orgs
    summary: "Deception, Performance - a travelling show and the tricks that keep it running."
    text: "Whether you performed under the lights or kept the show on the road behind them, you found a home among the Phantasmic Circus. Years of carrying wonder from town to town taught you a little real illusion magic and a great deal about misdirection."
    proficiencies:
      skills: [deception, performance]
      tools: ["disguise kit"]
    gold: 12
    equipment:
      - {id: disguise-kit, qty: 1}
      - {id: gaming-set, qty: 1}
      - {id: clothes-costume, qty: 1}
      - {id: mirror-steel, qty: 1}
      - {id: clothes-travelers, qty: 1}
    feature:
      name: Arcane Artist
      text: "This background grants the arcane artist feat, which teaches you minor illusion and lets one ally a day take heart from your illusion magic. Add it to your feats; the sheet carries its full text there. Newer books hand a feat out with the background this way rather than waiting for an ability score improvement."
    traits:
      - "I can read a crowd in seconds and I play to whoever is watching."
      - "I would rather be laughed at than ignored."
      - "I keep three things in my hands at all times, and one of them is not really there."
      - "I remember every town by what the audience there was like."
    ideals:
      - "Wonder. People carry a good show around with them for years. That is worth doing."
      - "Family. The company looks after its own, and I am company."
      - "Freedom. I have never slept in the same town twice if I could help it."
      - "Craft. Anyone can startle a crowd. Delighting one takes work."
    bonds:
      - "The circus took me in when nobody else would, and I owe it everything."
      - "A rival company stole an act of mine and I want it back."
      - "Someone in the audience recognised me once, and I have been moving ever since."
      - "I am keeping something that belongs to the ringmaster, and I have not decided why."
    flaws:
      - "I cannot resist an audience, even a dangerous one."
      - "I lie for practice, and sometimes I forget to stop."
      - "I take any criticism of the show as a personal wound."
      - "I always have an exit picked out, and I have used it on people who trusted me."

  - id: sage
    name: Sage
    source: orgs
    summary: "Arcana, History, two languages - you know where to look it up."
    text: "You spent years learning the lore of the multiverse, scouring manuscripts, studying scrolls and listening to the greatest experts on the subjects that interest you."
    proficiencies:
      skills: [arcana, history]
    languages: 2
    gold: 10
    equipment:
      - {id: ink-1-ounce-bottle, qty: 1}
      - {id: ink-pen, qty: 1}
      - {id: parchment-one-sheet, qty: 10}
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Researcher
      text: "When you attempt to learn or recall a piece of lore, if you do not know it you often know where and from whom you can obtain it: a library, a scriptorium, a university, a sage or another learned creature."
    traits:
      - "I use polysyllabic words that convey the impression of great erudition."
      - "I have read every book in the world's greatest libraries, or I would like to."
      - "I am used to helping out those who are not as smart as I am, and I explain patiently."
      - "There is nothing I like more than a good mystery."
    ideals:
      - "Knowledge. The path to power and self improvement is through knowledge."
      - "Beauty. What is beautiful points us beyond itself toward what is true."
      - "Logic. Emotions must not cloud our logical thinking."
      - "No Limits. Nothing should fetter the infinite possibility inherent in all existence."
    bonds:
      - "It is my duty to protect my students."
      - "I hold an ancient text with terrible secrets that must not fall into the wrong hands."
      - "I work to preserve a library, university, scriptorium or monastery."
      - "I have been searching my whole life for the answer to one question."
    flaws:
      - "I am easily distracted by the promise of information."
      - "Most people scream and run when they see a demon. I stop and take notes."
      - "Unlocking an ancient mystery is worth the price of a civilisation."
      - "I speak without thinking through my words, invariably insulting others."

  - id: sailor
    name: Sailor
    source: orgs
    summary: "Athletics, Perception - passage on any ship that will have you."
    text: "You sailed on a seagoing vessel for years. In that time you faced down mighty storms, monsters of the deep and those who wanted to sink your craft to the bottomless depths."
    proficiencies:
      skills: [athletics, perception]
      tools: ["navigator's tools", "vehicles (water)"]
    gold: 10
    equipment:
      - {id: rope-hempen-50-feet, qty: 1}
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Ship's Passage
      text: "When you need to, you can secure free passage on a sailing ship for yourself and your companions, in exchange for helping crew the vessel. You may have to wait for a suitable ship and voyage."
    traits:
      - "My friends know they can rely on me, no matter what."
      - "I work hard so that I can play hard when the work is done."
      - "I enjoy sailing into new ports and making new friends over a flagon of ale."
      - "I like a job well done, especially if I can convince someone else to do it."
    ideals:
      - "Respect. What keeps a ship together is mutual respect between captain and crew."
      - "Fairness. We all do the work, so we all share in the rewards."
      - "Freedom. The sea is freedom, the freedom to go anywhere and do anything."
      - "People. I am committed to my crewmates, not to ideals."
    bonds:
      - "I am loyal to my captain first, everything else second."
      - "The ship is most important, crewmates and captains come and go."
      - "I will always remember my first ship."
      - "Someone saved my life on deck, and I will spare no expense for them."
    flaws:
      - "I follow orders, even when I think they are wrong."
      - "I will say anything to avoid extra work."
      - "Once someone questions my courage I never back down, no matter how dangerous."
      - "I like to start a fight."

  - id: soldier
    name: Soldier
    source: orgs
    summary: "Athletics, Intimidation - a rank other soldiers still respect."
    text: "War has been your life for as long as you care to remember. You trained as a youth, studied the use of weapons and armour, learned basic survival techniques and how to stay alive on the battlefield."
    proficiencies:
      skills: [athletics, intimidation]
      tools: ["one gaming set", "vehicles (land)"]
    gold: 10
    equipment:
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: Military Rank
      text: "You have a military rank from your career as a soldier. Soldiers loyal to your former organisation still recognise your authority, and you can invoke your rank to requisition simple equipment or gain access to a friendly encampment."
    traits:
      - "I am always polite and respectful."
      - "I am haunted by memories of war, I cannot get the images of violence out of my mind."
      - "I have lost too many friends and I am slow to make new ones."
      - "I can stare down a hell hound without flinching."
    ideals:
      - "Greater Good. Our lot is to lay down our lives in defence of others."
      - "Responsibility. I do what I must and obey just authority."
      - "Independence. When people follow orders blindly they embrace a kind of tyranny."
      - "Might. In life as in war, the stronger force wins."
    bonds:
      - "I would still lay down my life for the people I served with."
      - "Someone saved my life on the battlefield, I will never leave a friend behind."
      - "My honour is my life."
      - "I will never forget the crushing defeat my company suffered."
    flaws:
      - "The enemy we faced in battle still leaves me quivering with fear."
      - "I have little respect for anyone who is not a proven warrior."
      - "I made a mistake in battle that cost lives, and I would do anything to keep it secret."
      - "My hatred of my enemies is blind and unreasoning."

  - id: urchin
    name: Urchin
    source: orgs
    summary: "Sleight of Hand, Stealth - every shortcut in the city."
    text: "You grew up on the streets alone, orphaned and poor. You had no one to watch over you or provide for you, so you learned to provide for yourself. You fought fiercely over food and kept a constant watch out for other desperate souls."
    proficiencies:
      skills: [sleight-of-hand, stealth]
      tools: ["disguise kit", "thieves' tools"]
    gold: 10
    equipment:
      - {id: clothes-common, qty: 1}
      - {id: pouch, qty: 1}
    feature:
      name: City Secrets
      text: "You know the secret patterns and flow of cities and can find passages through the urban sprawl that others would miss. When you are not in combat, you and your companions can travel between any two locations in a city twice as fast as your speed would normally allow."
    traits:
      - "I hide scraps of food and trinkets away in my pockets."
      - "I ask a lot of questions."
      - "I like to squeeze into small places where no one else can get to me."
      - "I sleep with my back to a wall, everything I own wrapped in a bundle in my arms."
    ideals:
      - "Respect. All people, rich or poor, deserve respect."
      - "Community. We have to take care of each other, because no one else will."
      - "Change. The low are lifted up and the high fall. Change is the nature of things."
      - "Retribution. The rich need to be shown what life is like in the gutters."
    bonds:
      - "My town or city is my home, and I will fight to defend it."
      - "I sponsor an orphanage so that others do not endure what I did."
      - "I owe my survival to another urchin who taught me to live on the streets."
      - "No one else should have to endure the hardship I have been through."
    flaws:
      - "If I am outnumbered I will run away from a fight."
      - "Gold seems like a lot of money to me, and I will do almost anything for more of it."
      - "I will never fully trust anyone other than myself."
      - "I would rather kill someone in their sleep than fight fair."
