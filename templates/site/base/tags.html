{{define "main"}}
<article class="page listing">
  <header class="page-header"><h1 class="page-title">Tags</h1><p class="page-subtitle">{{plural (len .Site.Tags) "tag" "tags"}}</p></header>
  <ul class="tag-cloud">
  {{- range .Site.Tags}}
    <li class="w{{.Weight}}"><a class="tag" href="{{$.Root}}{{.URL}}">{{.Name}}<span class="count">{{.Count}}</span></a></li>
  {{- end}}
  </ul>
</article>
{{end}}
