name: release

# A v* tag builds every platform with goreleaser (.goreleaser.yaml) and
# publishes the archives and checksums.txt as a github release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from the history since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build checks
        run: |
          go build ./...
          go test ./internal/assets/ ./internal/common/ ./internal/common/dnd/ ./cmd/oc/commands/dnd/

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
