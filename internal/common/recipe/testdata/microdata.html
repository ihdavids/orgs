<!DOCTYPE html>
<html><head><title>Lemon Bars</title></head>
<body>
<div itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Lemon Bars</h1>
  <img itemprop="image" src="https://old.example/lemon-bars.jpg" alt="">
  <p itemprop="description">Tart, sweet and <em>easy</em>.</p>
  <span>Makes <span itemprop="recipeYield">16 bars</span></span>
  <meta itemprop="prepTime" content="PT20M">
  <time itemprop="cookTime" datetime="PT40M">40 minutes</time>
  <ul>
    <li itemprop="recipeIngredient">1 cup butter, softened</li>
    <li itemprop="recipeIngredient">½ cup white sugar</li>
    <li itemprop="recipeIngredient">2 cups all-purpose flour</li>
    <li itemprop="recipeIngredient">4 eggs</li>
  </ul>
  <div itemprop="recipeInstructions">
    <ol><li>Preheat oven to 350 degrees F.</li><li>Blend butter, flour and sugar; press into a pan.</li><li>Bake 15 to 20 minutes.</li></ol>
  </div>
</div>
</body></html>
